# Drop into the drughelp.co server {} block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Proxies only this path. Rest of the static site stays as-is.

location = /hidden-camera-detector {
  return 308 /hidden-camera-detector/;
}

location /hidden-camera-detector/ {
  proxy_pass https://hidden-camera-detector.vercel.app/hidden-camera-detector/;
  proxy_ssl_server_name on;
  proxy_set_header Host hidden-camera-detector.vercel.app;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_http_version 1.1;
  proxy_read_timeout 60s;
}
